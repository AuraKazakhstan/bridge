services:
  bridge:
    build: .
    image: bridge:latest
    container_name: bridge
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    networks:
      - bridgenet

  nginx:
    image: nginx:alpine
    container_name: bridge-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - bridge
    networks:
      - bridgenet

networks:
  bridgenet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

# TLS-терминатор перед мостом bridge (Go слушает голый HTTP :8080).
# Мост верит X-Real-Ip/X-Forwarded-For только от доверенных прокси
# (BRIDGE_TRUSTED_PROXIES = docker-сеть) — поэтому проставляем их здесь.
server {
    listen 443 ssl;
    server_name api-test.aura-it.kz;

    ssl_certificate     /etc/nginx/certs/aura-it_kz.pem;
    ssl_certificate_key /etc/nginx/certs/aura-it_kz.key;

    # у моста свой лимит тела (BRIDGE_MAX_BODY_BYTES=10m); держим их согласованными
    client_max_body_size 10m;

    location / {
        proxy_pass http://bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # держим синхронно с BRIDGE_UPSTREAM_TIMEOUT в .env (+запас, чтобы nginx
        # не обрывал соединение раньше, чем мост дождётся апстрима)
        proxy_read_timeout 125s;
    }
}
